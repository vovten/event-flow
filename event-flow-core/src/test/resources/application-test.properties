# Test configuration for event-flow
spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers}

event.dispatcher.thread.pool.size=5
event.listener.scan.package=com.github.vovten.eventflow

# Unified dispatcher configuration
event.dispatcher.enabled=true

# Internal event bus
event.internal.enabled=true

# External event bus (Kafka)
event.external.enabled=false
event.external.dispatcher.topics=test-events

# Transactional publishing
event.publishing.transactional=false

# Kafka consumer config for tests
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.group-id=test-consumer-group
