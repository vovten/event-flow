# =============================================================================
# Event Flow Configuration
# =============================================================================
# This file contains the default settings for Event Flow auto-configuration.
# Copy and modify these properties in your application.yml/application.properties
# to customize the behavior.
#
# Usage:
# 1. Copy this file to your resources directory as reference
# 2. Override only the properties you need to change in your application.yml
# 3. Set 'event-flow.enabled: false' to completely disable auto-configuration
# =============================================================================

event-flow:
  # Enable or disable all Event Flow auto-configuration
  enabled: false

  # ---------------------------------------------------------------------------
  # Event Publisher Configuration
  # ---------------------------------------------------------------------------
  publisher:
    # Enable or disable publisher auto-configuration
    enabled: false

    # Enable or disable transactional publishing (defer until after transaction commit)
    # When true, events are published only after the current transaction commits
    transactional: true

    # Retry configuration for event publishing
    retry:
      # Enable or disable retry mechanism
      enabled: true
      # Maximum number of retry attempts
      max-attempts: 3
      # Initial delay between retries (use ms, s, m suffixes)
      initial-delay: 100ms
      # Backoff multiplier for exponential backoff
      multiplier: 2.0

    # Enable logging of published events
    # Logs include: eventId, processId, channels, payload, status, deliveredTo, etc.
    logging:
      # Enable or disable event logging
      enabled: false
      # Maximum length of payload in log output (characters)
      max-payload-length: 500
      # Event types (simple class names) to exclude from logging
      # Default: SuccessAck, FailureAck (lifecycle acknowledgment events)
      excluded-events:
        - SuccessAck
        - FailureAck
      # Per-event log level overrides
      # Key: event simple class name, Value: log level name (TRACE, DEBUG, INFO, WARN, ERROR)
      # When set, overrides the default status-based log level for matching events
      log-levels:
        HeartbeatEvent: DEBUG

    # Circuit breaker configuration for event publishing
    # Protects transport layer by rejecting publishes when failure rate is high.
    # Groups failures by event type — when one event type fails, other types are unaffected.
    # Events are persisted before the breaker check, so no events are lost when open.
    # Scheduler retries bypass the breaker automatically.
    circuit-breaker:
      # Enable or disable circuit breaker protection
      enabled: false
      # Minimum requests before evaluating the failure rate
      failure-threshold: 10
      # Failure rate (0.0-1.0) that triggers circuit open (0.8 = 80%)
      failure-rate-threshold: 0.8
      # Cooldown before transitioning from OPEN to HALF_OPEN
      cooldown: 60s
      # Max failed attempts in HALF_OPEN before re-opening
      half-open-max-attempts: 3
      # Maximum number of circuit breaker entries in the cache
      # Idle CLOSED entries are evicted automatically; OPEN entries stay active
      max-cache-size: 1000

    # ---------------------------------------------------------------------------
    # Lifecycle-aware event publishing (event lifecycle tracking)
    # ---------------------------------------------------------------------------
    lifecycle:
      # Enable or disable lifecycle-aware event publishing and lifecycle tracking
      enabled: false
      # Service name stamped on outgoing events for ack filtering
      service-name: ""

      # Event store configuration
      store:
        # Store type: "db" (database, default), "in-memory" (non-persistent), or custom
        type: db
        # Name of the database table for event storage (only for type: db)
        table-name: event_store
        # Automatically create the table on startup (requires DDL privileges)
        # Set to false in production and manage schema via Flyway/Liquibase.
        # Dialect-specific DDL scripts are available in the classpath at:
        #   io/github/vovten/eventflow/lifecycle/store/db/event-store-<dialect>.sql
        auto-init-schema: false

      # Retry configuration for lifecycle event tracking
      retry:
        # Enable or disable automatic retry of failed and stuck events
        enabled: true
        # Maximum number of retry attempts
        max-retries: 3
        # Interval between retry cycles
        retry-interval: 30s
        # Base backoff interval for retries (delay = min-age × 2^retryCount)
        # Examples with 30s: 1st retry=30s, 2nd=60s, 3rd=120s
        min-age: 30s
        # Maximum number of events to fetch per retry cycle
        batch-size: 1000

      # Cleanup configuration for lifecycle event tracking
      # Removes old terminal events (HANDLED, UNDEFINED) to prevent unbounded growth
      # FAILED events are never cleaned up automatically — preserved for manual inspection
      cleanup:
        # Enable or disable automatic cleanup of old terminal events
        enabled: false
        # How often the cleanup cycle runs
        interval: 60m
        # Events older than this duration are eligible for deletion
        max-age: 7d
        # Maximum number of events to delete in a single batch
        batch-size: 1000
        # Pause between consecutive delete batches to spread database load
        pause-between-batches: 100ms

    # Event channels configuration
    # Each channel defines a logical route with a list of transports
    # Transport name identifies the type (e.g., "local-queue", "kafka", "broadcast-kafka")
    # Channel types: internal (InternalEventChannel), external (ExternalEventChannel), broadcast (BroadcastEventChannel)
    # You can add custom channels with any name (they will use GenericEventChannel)
    # You can also implement custom OutTransportFactory to add your own transport types
    channels:
      - name: internal
        transports:
          - name: local-queue
            capacity: 1000
      - name: external
        transports:
          - name: kafka
            servers: localhost:9092
            topics: events
            serialization: json
      - name: broadcast
        transports:
          - name: broadcast-kafka
            servers: localhost:9092
            topics: events

  # ---------------------------------------------------------------------------
  # Event Dispatcher Configuration
  # ---------------------------------------------------------------------------
  dispatcher:
    # Enable or disable dispatcher auto-configuration
    enabled: false

    # Package(s) to scan for @EventListener annotated beans
    # Multiple packages can be specified as comma-separated values
    listener-packages: "io.github.vovten.eventflow"

    # Deserialization security configuration
    deserialization:
      # List of allowed event packages for secure deserialization
      # Events from these packages can be safely deserialized
      allowed-event-packages:
        - io.github.vovten.eventflow

    # Thread pool configuration for async event delivery
    thread-pool:
      # Core pool size (minimum number of threads)
      # Note: When using virtual threads (default), this setting is ignored
      core-size: 4
      # Maximum pool size (maximum number of threads)
      # Note: When using virtual threads (default), this setting is ignored
      max-size: 16
      # Task queue capacity (max events waiting to be processed)
      # Note: When using virtual threads (default), this setting is ignored
      queue-capacity: 100
      # Keep-alive time for idle threads in seconds
      # Note: When using virtual threads (default), this setting is ignored
      keep-alive-seconds: 60
      # Maximum number of concurrent handler executions.
      # Provides backpressure when using virtual thread executors.
      # When 0 (default), no limit is applied.
      #
      # Recommended values:
      #   - I/O-bound handlers (DB, HTTP): 20-100
      #   - CPU-bound handlers: number of CPU cores
      #   - Mixed workload: 50-200
      concurrency-limit: 0

    # Incoming event transports to listen to
    transports:
      - name: local-queue
        capacity: 1000
      - name: kafka
        servers: localhost:9092
        topics: events
        consumerGroup: event-flow-group

    # Idempotent event processing configuration
    # Prevents duplicate event processing using a Caffeine cache
    idempotent:
      # Enable or disable idempotent processing
      enabled: false
      # Time-to-live for cached event UIDs (use ms, s, m, h suffixes)
      ttl: 10m
      # Maximum number of entries in the cache
      max-size: 10000
      # Log warnings when duplicate events are received
      warn-on-duplicate: false

    # Enable logging of dispatched events at INFO level
    # Logs include: eventId, handler, durationMs, payload, status
    logging:
      # Enable or disable event logging
      enabled: false
      # Maximum length of payload in log output (characters)
      max-payload-length: 500
      # Event types (simple class names) to exclude from logging
      # Default: SuccessAck, FailureAck (lifecycle acknowledgment events)
      excluded-events:
        - SuccessAck
        - FailureAck
      # Per-event log level overrides
      # Key: event simple class name, Value: log level name (TRACE, DEBUG, INFO, WARN, ERROR)
      # When set, overrides the default status-based log level for matching events
      log-levels:
        HeartbeatEvent: DEBUG

    # Lifecycle configuration
    # When enabled, the dispatcher publishes SuccessAck / FailureAck events
    # back to the source channels after handler execution
    lifecycle:
      # Enable or disable ack-based lifecycle tracking
      enabled: false
