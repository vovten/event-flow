# =============================================================================
# Event Flow Configuration
# =============================================================================
# This file contains the default settings for Event Flow auto-configuration.
# Copy and modify these properties in your application.yml/application.properties
# to customize the behavior.
#
# Usage:
# 1. Copy this file to your resources directory as reference
# 2. Override only the properties you need to change in your application.yml
# 3. Set 'event-flow.enabled: false' to completely disable auto-configuration
# =============================================================================

event-flow:
  # Enable or disable all Event Flow auto-configuration
  enabled: false

  # ---------------------------------------------------------------------------
  # Event Publisher Configuration
  # ---------------------------------------------------------------------------
  publisher:
    # Enable or disable publisher auto-configuration
    enabled: false

    # Enable or disable transactional publishing (defer until after transaction commit)
    # When true, events are published only after the current transaction commits
    transactional: true

    # Immediate in-memory retry for event publishing.
    #
    # Purpose:
    #   retries failed transport sends in the same process with exponential
    #   backoff. It smooths over short glitches such as a network blip or a
    #   temporarily unavailable broker.
    #
    # When to use:
    #   - you only need a lightweight, best-effort transport retry;
    #   - lifecycle tracking is disabled and you do not need ack-based or
    #     persistent delivery guarantees.
    #
    # When NOT to use:
    #   - retries must survive a restart or cover lost acknowledgments;
    #     use event-flow.publisher.lifecycle.retry.delivery instead.
    #
    # This layer does not persist retry state. If the process stops, pending
    # retries are lost. It is applied before the lifecycle-aware wrapper.
    retry:
      # Enable or disable the in-memory transport retry
      enabled: false
      # Maximum number of retry attempts
      max-attempts: 3
      # Initial delay between retries (use ms, s, m suffixes)
      initial-delay: 100ms
      # Backoff multiplier for exponential backoff
      multiplier: 2.0

    # Enable logging of published events
    # Logs include: eventId, processId, channels, payload, status, deliveredTo, etc.
    logging:
      # Enable or disable event logging
      enabled: false
      # Maximum length of payload in log output (characters)
      max-payload-length: 500
      # Event types (simple class names) to exclude from logging
      # Default: AcceptedAck, NoHandlerAck, SuccessAck, FailureAck (lifecycle acknowledgment events)
      excluded-events:
        - AcceptedAck
        - NoHandlerAck
        - SuccessAck
        - FailureAck
      # Per-event minimum log level for suppressing low-severity entries
      # Key: payload simple class name or fully-qualified class name (e.g. "HeartbeatEvent"
      # or "io.example.HeartbeatEvent"); FQCN keys are validated at startup, and invalid
      # entries fail fast with an IllegalArgumentException.
      # Value: minimum threshold (only ERROR and WARN suppress; INFO/DEBUG/TRACE mean no
      # suppression). The entry is emitted at its natural status-based level
      # (INFO=success, WARN=partial, ERROR=failure); the value only filters it out.
      log-levels:
        HeartbeatEvent: ERROR

    # ---------------------------------------------------------------------------
    # Lifecycle-aware event publishing (event lifecycle tracking)
    # ---------------------------------------------------------------------------
    lifecycle:
      # Enable or disable lifecycle-aware event publishing and lifecycle tracking
      enabled: false
      # Service name stamped on outgoing events for ack filtering
      service-name: ""

      # Event store configuration
      store:
        # Store type: "db" (database, default), "in-memory" (non-persistent), or custom
        type: db
        # Name of the database table for event storage (only for type: db)
        table-name: event_store
        # Automatically create the table on startup (requires DDL privileges)
        # Set to false in production and manage schema via Flyway/Liquibase.
        # Dialect-specific DDL scripts are available in the classpath at:
        #   io/github/vovten/eventflow/lifecycle/store/db/event-store-<dialect>.sql
        auto-init-schema: false

      # Durable retry configuration (publisher-side).
      # The shared settings are used by both the delivery and processing
      # schedulers; the delivery and processing blocks configure each domain.
      retry:
        # Delay between delivery/processing retry cycles.
        interval: 30s
        # Maximum time to wait for an AcceptedAck (delivery) or a final ack
        # (durable processing). Must exceed the longest local retry campaign.
        ack-timeout: 5m
        # Maximum number of retry rows handled per cycle.
        batch-size: 100
        # Name of the durable retry table shared by both retry domains.
        table-name: event_retry

        # Delivery retry configuration.
        delivery:
          # Enable durable delivery retries.
          enabled: false
          # Maximum number of delivery retries after the first publish.
          max-retries: 3
          # Base delay before the first durable delivery retry.
          retry-delay: 30s
          # When true, a successful publish must be confirmed by AcceptedAck.
          # Set to false during a mixed-version fleet migration.
          require-accepted-ack: true

        # Durable processing retry configuration (publisher-side).
        # The publisher executes the retry decision carried by FailureAck and
        # does not read the dispatcher policy.
        processing:
          # Enable durable processing retries on the publisher side.
          enabled: false
          # Global hard cap for processing attempts, independent of listener policies.
          max-attempts: 100
          # Fallback delay when a FailureAck does not carry a relative delay.
          default-delay: 30s
          # Upper clamp for a consumer-provided retry delay.
          max-delay: 10m

      # Cleanup configuration for lifecycle event tracking
      # Removes old terminal events (HANDLED, UNDEFINED) to prevent unbounded growth
      # FAILED events are never cleaned up automatically — preserved for manual inspection
      cleanup:
        # Enable or disable automatic cleanup of old terminal events
        enabled: false
        # How often the cleanup cycle runs
        interval: 60m
        # Events older than this duration are eligible for deletion
        max-age: 7d
        # Maximum number of events to delete in a single batch
        batch-size: 1000
        # Pause between consecutive delete batches to spread database load
        pause-between-batches: 100ms

    # Event channels configuration
    # Each channel defines a logical route with a list of transports
    # Transport name identifies the type (e.g., "local-queue", "kafka", "broadcast-kafka")
    # Channel types: internal (InternalEventChannel), external (ExternalEventChannel), broadcast (BroadcastEventChannel)
    # You can add custom channels with any name (they will use GenericEventChannel)
    # You can also implement custom OutTransportFactory to add your own transport types
    channels:
      - name: internal
        transports:
          - name: local-queue
            capacity: 1000
      - name: external
        transports:
          - name: kafka
            servers: localhost:9092
            topics: events
            serialization: json
            # Kafka record key strategy (partition routing).
            # Values: none (default), process-id, event-type, metadata:<name>, bean:<beanName>
            # key: process-id
      - name: broadcast
        transports:
          - name: broadcast-kafka
            servers: localhost:9092
            topics: events

  # ---------------------------------------------------------------------------
  # Event Dispatcher Configuration
  # ---------------------------------------------------------------------------
  dispatcher:
    # Enable or disable dispatcher auto-configuration
    enabled: false

    # Package(s) to scan for @EventListener annotated beans
    # Multiple packages can be specified as comma-separated values
    listener-packages: "io.github.vovten.eventflow"

    # Deserialization security configuration
    deserialization:
      # List of allowed event packages for secure deserialization
      # Events from these packages can be safely deserialized
      allowed-event-packages:
        - io.github.vovten.eventflow

    # Thread pool configuration for async event delivery
    thread-pool:
      # Core pool size (minimum number of threads)
      # Note: When using virtual threads (default), this setting is ignored
      core-size: 4
      # Maximum pool size (maximum number of threads)
      # Note: When using virtual threads (default), this setting is ignored
      max-size: 16
      # Task queue capacity (max events waiting to be processed)
      # Note: When using virtual threads (default), this setting is ignored
      queue-capacity: 100
      # Keep-alive time for idle threads in seconds
      # Note: When using virtual threads (default), this setting is ignored
      keep-alive-seconds: 60
      # Maximum number of concurrent handler executions.
      # Provides backpressure when using virtual thread executors.
      # When 0 (default), no limit is applied.
      #
      # Recommended values:
      #   - I/O-bound handlers (DB, HTTP): 20-100
      #   - CPU-bound handlers: number of CPU cores
      #   - Mixed workload: 50-200
      concurrency-limit: 0

    # Incoming event transports to listen to
    transports:
      - name: local-queue
        capacity: 1000
      - name: kafka
        servers: localhost:9092
        topics: events
        consumerGroup: event-flow-group

    # Idempotent event processing configuration
    # Prevents duplicate event processing using a Caffeine cache
    idempotent:
      # Enable or disable idempotent processing
      enabled: false
      # Time-to-live for cached event UIDs (use ms, s, m, h suffixes)
      ttl: 10m
      # Maximum number of entries in the cache
      max-size: 10000
      # Log warnings when duplicate events are received
      warn-on-duplicate: false

    # Enable logging of dispatched events at INFO level
    # Logs include: eventId, handler, durationMs, payload, status
    logging:
      # Enable or disable event logging
      enabled: false
      # Maximum length of payload in log output (characters)
      max-payload-length: 500
      # Event types (simple class names) to exclude from logging
      # Default: AcceptedAck, NoHandlerAck, SuccessAck, FailureAck (lifecycle acknowledgment events)
      excluded-events:
        - AcceptedAck
        - NoHandlerAck
        - SuccessAck
        - FailureAck
      # Per-event minimum log level for suppressing low-severity entries
      # Key: payload simple class name or fully-qualified class name (e.g. "HeartbeatEvent"
      # or "io.example.HeartbeatEvent"); FQCN keys are validated at startup, and invalid
      # entries fail fast with an IllegalArgumentException.
      # Value: minimum threshold (only ERROR and WARN suppress; INFO/DEBUG/TRACE mean no
      # suppression). The entry is emitted at its natural status-based level
      # (INFO=success, WARN=partial, ERROR=failure); the value only filters it out.
      log-levels:
        HeartbeatEvent: ERROR

    # Lifecycle configuration
    # When enabled, the dispatcher publishes SuccessAck / FailureAck events
    # back to the source channels after handler execution
    lifecycle:
      # Enable or disable ack-based lifecycle tracking
      enabled: false

      # Processing retry policy (listener-side).
      # The top-level settings are the default policy; named policies override
      # only the fields they specify. A policy splits its budget between the
      # local and durable layers: local-max-retries run in-process, the rest
      # are executed by the publisher when
      # event-flow.publisher.lifecycle.retry.processing.enabled=true.
      retry:
        # Enable processing retries (local and durable).
        enabled: false
        # Absolute cap for local retry attempts, independent of listener policies.
        local-retry-cap: 10
        # Retries performed locally before durable re-publication.
        # 0 = durable-only; total-retries = local-only.
        # A value below total-retries makes the remaining attempts durable.
        local-max-retries: 3
        # Total retries after the first attempt (local + durable).
        total-retries: 15
        # Delay before the first retry.
        initial-delay: 3s
        # Exponential backoff multiplier applied to each subsequent retry.
        multiplier: 2.0
        # Upper bound for the computed backoff delay.
        max-delay: 10m
        # Jitter fraction in [0, 1]; 1.0 means full jitter.
        jitter: 0.5
        # Empty means retry any exception. Class names must be Throwable types.
        retry-on: []
        no-retry-on: []
        # Named policy overrides. Only specified fields are overridden.
        policies:
          # payment:
          #   total-retries: 7
          #   local-max-retries: 1
          #   initial-delay: 2s
          #   multiplier: 2.0
          #   max-delay: 30s
          #   jitter: 0.25
          #   retry-on:
          #     - io.example.PaymentUnavailableException
          #   no-retry-on:
          #     - io.example.PaymentRejectedException
