# =============================================================================
# Event Flow Default Configuration
# =============================================================================
# This file contains default settings for Event Flow auto-configuration.
# Copy and modify these properties in your application.yml/application.properties
# to customize the behavior.
#
# Usage:
# 1. Copy this file to your resources directory as reference
# 2. Override only the properties you need to change in your application.yml
# 3. Set 'event-flow.enabled: false' to completely disable auto-configuration
# =============================================================================

event-flow:
  # Enable or disable all Event Flow auto-configuration
  # Set to true to enable auto-configuration (disabled by default)
  enabled: false

  # ---------------------------------------------------------------------------
  # Event Publisher Configuration
  # ---------------------------------------------------------------------------
  publisher:
    # Enable or disable publisher auto-configuration
    enabled: false

    # Enable transactional publishing (defer until after transaction commit)
    # When true, events are published only after the current transaction commits
    transactional: true

    # Retry configuration for event publishing
    retry:
      # Enable or disable retry mechanism
      enabled: true
      # Maximum number of retry attempts
      max-attempts: 3
      # Initial delay between retries (use ms, s, m suffixes)
      initial-delay: 100ms
      # Backoff multiplier for exponential backoff
      multiplier: 2.0

    # Async publishing configuration
    # Publish events asynchronously using a dedicated thread pool
    async:
      # Enable or disable async publishing
      enabled: false
      # Core pool size (minimum number of threads)
      core-size: 2
      # Maximum pool size (maximum number of threads)
      max-size: 10
      # Task queue capacity (max events waiting to be published)
      queue-capacity: 1000
      # Keep-alive time for idle threads in seconds
      keep-alive-seconds: 60
      # Thread name prefix for async publisher threads
      thread-name-prefix: "event-flow-async-publisher"

    # Enable silent mode (catch and log all exceptions without rethrowing)
    # When true, the publisher will never throw exceptions
    silent: false

    # Event channels configuration
    # Each channel defines a logical route with a list of transports
    # Transport name identifies the type (e.g., "local-queue", "kafka")
    # Note: No default channel is configured. You must explicitly define at least one channel.
    channels:
      # Example: Internal channel with local-queue transport
      # - name: internal
      #   transports:
      #     - name: local-queue
      #       capacity: 1000

      # Example: External channel with Kafka transport
      # - name: external
      #   transports:
      #     - name: kafka
      #       topic: events
      #       servers: localhost:9092
      #       # Serialization format (default: json)
      #       # - json: UTF-8 encoded JSON, readable in Kafka UI tools
      #       # - msgpack: Compact binary format for better performance
      #       serialization: json

  # ---------------------------------------------------------------------------
  # Event Dispatcher Configuration
  # ---------------------------------------------------------------------------
  dispatcher:
    # Enable or disable dispatcher auto-configuration
    enabled: false

    # Package(s) to scan for @EventListener annotated beans
    # Multiple packages can be specified as comma-separated values
    # Example: "com.example.listener,com.example.handler"
    listener-packages: ""

    # Deserialization security configuration
    deserialization:
      # List of allowed event packages for secure deserialization
      # Events from these packages can be safely deserialized
      # Default: com.github.vovten.eventflow
      allowed-event-packages:
        - com.github.vovten.eventflow

    # Thread pool configuration for async event delivery
    thread-pool:
      # Core pool size (minimum number of threads)
      # Note: When using virtual threads (default), this setting is ignored
      core-size: 4
      # Maximum pool size (maximum number of threads)
      # Note: When using virtual threads (default), this setting is ignored
      max-size: 16
      # Task queue capacity (max events waiting to be processed)
      # Note: When using virtual threads (default), this setting is ignored
      queue-capacity: 100
      # Keep-alive time for idle threads in seconds
      # Note: When using virtual threads (default), this setting is ignored
      keep-alive-seconds: 60
      # Maximum number of concurrent handler executions.
      # Provides backpressure when using virtual thread executors.
      # When 0 (default), no limit is applied.
      #
      # Recommended values:
      #   - I/O-bound handlers (DB, HTTP): 20-100
      #   - CPU-bound handlers: number of CPU cores
      #   - Mixed workload: 50-200
      concurrency-limit: 0

    # Incoming event transports to listen to
    # Note: No default transport is configured. You must explicitly define at least one transport.
    transports:
      # Example: Local-queue transport
      # - name: local-queue
      #   capacity: 1000

      # Example: Kafka transport
      # - name: kafka
      #   topic: events
      #   servers: localhost:9092
      #   consumerGroup: event-flow-group

    # Idempotent event processing configuration
    # Prevents duplicate event processing using a Caffeine cache
    idempotent:
      # Enable or disable idempotent processing
      enabled: false
      # Time-to-live for cached event UIDs (use ms, s, m, h suffixes)
      ttl: 10m
      # Maximum number of entries in the cache
      max-size: 10000
      # Log warnings when duplicate events are received
      warn-on-duplicate: true

# =============================================================================
# Configuration Examples
# =============================================================================
#
# Example 1: Minimal configuration with local-queue
# ---------------------------------------------------------------------------
# event-flow:
#   enabled: true
#   dispatcher.listener-packages: com.example
#   publisher:
#     enabled: true
#     channels:
#       - name: internal
#         transports:
#           - name: local-queue
#             capacity: 1000
#   dispatcher:
#     enabled: true
#     transports:
#       - name: local-queue
#         capacity: 1000
#
# Example 2: Production configuration with Kafka
# ---------------------------------------------------------------------------
# event-flow:
#   enabled: true
#   dispatcher.listener-packages: com.example.listener
#   publisher:
#     enabled: true
#     transactional: true
#     retry:
#       enabled: true
#       max-attempts: 3
#       initial-delay: 200ms
#       multiplier: 2.0
#     channels:
#       - name: internal
#         transports:
#           - name: local-queue
#             capacity: 1000
#       - name: external
#         transports:
#           - name: kafka
#             topic: events
#             servers: kafka:9092
#             serialization: json  # or msgpack for binary format
#   dispatcher:
#     enabled: true
#     thread-pool:
#       core-size: 8
#       max-size: 32
#       queue-capacity: 500
#       # Backpressure for virtual threads: max 50 concurrent handlers
#       concurrency-limit: 50
#     transports:
#       - name: local-queue
#         capacity: 1000
#       - name: kafka
#         topic: events
#         servers: kafka:9092
#         consumerGroup: my-service-group
#
# Example 3: Development configuration (local-queue only)
# ---------------------------------------------------------------------------
# event-flow:
#   enabled: true
#   dispatcher.listener-packages: com.example
#   publisher:
#     enabled: true
#     transactional: false
#     channels:
#       - name: internal
#         transports:
#           - name: local-queue
#             capacity: 500
#   dispatcher:
#     enabled: true
#     thread-pool:
#       core-size: 2
#       max-size: 4
#     transports:
#       - name: local-queue
#         capacity: 500
#
# Example 4: Configuration with idempotent event processing
# ---------------------------------------------------------------------------
# event-flow:
#   enabled: true
#   dispatcher.listener-packages: com.example
#   publisher:
#     enabled: true
#     channels:
#       - name: internal
#         transports:
#           - name: local-queue
#             capacity: 1000
#   dispatcher:
#     enabled: true
#     idempotent:
#       enabled: true
#       ttl: 30m
#       max-size: 50000
#       warn-on-duplicate: true
#     transports:
#       - name: local-queue
#         capacity: 1000
#
# Example 5: Disable auto-configuration and provide custom beans
# ---------------------------------------------------------------------------
# event-flow:
#   enabled: false
#
# Then create your own @Configuration class with custom beans:
# @Configuration
# public class CustomEventFlowConfig {
#     @Bean
#     public EventPublisher eventPublisher() { ... }
#
#     @Bean
#     public EventDispatcher eventDispatcher() { ... }
# }
#
# Example 6: Mixed serialization formats (JSON and MessagePack)
# ---------------------------------------------------------------------------
# event-flow:
#   enabled: true
#   dispatcher.listener-packages: com.example
#   publisher:
#     enabled: true
#     channels:
#       - name: internal
#         transports:
#           - name: local-queue
#             capacity: 1000
#       - name: external-json
#         transports:
#           - name: kafka
#             topic: events-json
#             servers: kafka:9092
#             serialization: json  # Readable in Kafka UI
#       - name: external-binary
#         transports:
#           - name: kafka
#             topic: events-binary
#             servers: kafka:9092
#             serialization: msgpack  # Compact binary format
#   dispatcher:
#     enabled: true
#     transports:
#       - name: kafka
#         topic: events-json
#         servers: kafka:9092
#         consumerGroup: group-json
#       - name: kafka
#         topic: events-binary
#         servers: kafka:9092
#         consumerGroup: group-binary
#     # Note: Dispatcher auto-detects serialization format from message
#
# Example 7: Async publisher for non-blocking event publishing
# ---------------------------------------------------------------------------
# event-flow:
#   enabled: true
#   dispatcher.listener-packages: com.example
#   publisher:
#     enabled: true
#     transactional: true
#     retry:
#       enabled: true
#       max-attempts: 3
#       initial-delay: 100ms
#       multiplier: 2.0
#     async:
#       enabled: true
#       core-size: 4
#       max-size: 16
#       queue-capacity: 512
#     channels:
#       - name: internal
#         transports:
#           - name: local-queue
#             capacity: 1000
#       - name: analytics
#         transports:
#           - name: kafka
#             topic: analytics-events
#             servers: kafka:9092
#             serialization: json
#   dispatcher:
#     enabled: true
#     transports:
#       - name: local-queue
#         capacity: 1000
#
# Note: With async enabled, the publish() method returns immediately and
# events are processed in the background. The decorator order is:
#   ChannelEventPublisher → Retry → Silent → Async → Transactional
# Use async for non-critical events (analytics, metrics, notifications)
# where the caller should not block waiting for network I/O.
#
# =============================================================================
