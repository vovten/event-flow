# Event Flow Auto-Configuration Metadata
# This file provides IDE hints for application.yml/properties

# Main configuration
event-flow.enabled=Enable or disable Event Flow auto-configuration completely
event-flow.listener-registry.scan-packages=Package(s) to scan for @EventListener annotated beans (comma-separated)

# Publisher configuration
event-flow.publisher.enabled=Enable or disable publisher auto-configuration
event-flow.publisher.transactional=Enable transactional publishing (defer until after transaction commit)

# Publisher retry configuration
event-flow.publisher.retry.enabled=Enable or disable retry mechanism for event publishing
event-flow.publisher.retry.max-attempts=Maximum number of retry attempts
event-flow.publisher.retry.initial-delay=Initial delay between retries (e.g., 100ms)
event-flow.publisher.retry.multiplier=Backoff multiplier for exponential backoff

# Publisher channels configuration
event-flow.publisher.channels[0].name=Unique channel name (e.g., "internal", "external")
event-flow.publisher.channels[0].type=Channel type: "local-queue" or "kafka"
event-flow.publisher.channels[0].capacity=Capacity for local-queue channels (queue size)
event-flow.publisher.channels[0].topic=Kafka topic name (for kafka type)
event-flow.publisher.channels[0].bootstrap-servers=Kafka bootstrap servers (for kafka type)

# Dispatcher configuration
event-flow.dispatcher.enabled=Enable or disable dispatcher auto-configuration
event-flow.dispatcher.thread-pool.core-size=Core pool size for event dispatching
event-flow.dispatcher.thread-pool.max-size=Maximum pool size for event dispatching
event-flow.dispatcher.thread-pool.queue-capacity=Task queue capacity for event dispatching
event-flow.dispatcher.thread-pool.keep-alive-seconds=Keep-alive time for idle threads in seconds

# Dispatcher incoming transports configuration
event-flow.dispatcher.transports[0].name=Unique transport name
event-flow.dispatcher.transports[0].type=Transport type: "local-queue" or "kafka"
event-flow.dispatcher.transports[0].capacity=Capacity for local-queue transport (queue size)
event-flow.dispatcher.transports[0].topic=Kafka topic name (for kafka type)
event-flow.dispatcher.transports[0].bootstrap-servers=Kafka bootstrap servers (for kafka type)
event-flow.dispatcher.transports[0].consumer-group=Kafka consumer group id (for kafka type)
